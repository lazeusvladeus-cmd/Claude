# Render Blueprint for the Vike Ads Studio dashboard (vike-ads/).
# Render dashboard -> New -> Blueprint -> pick this repo. It will ask for every `sync: false` value.
services:
  - type: web
    name: vike-ads-studio
    runtime: docker
    dockerfilePath: ./vike-ads/Dockerfile
    dockerContext: ./vike-ads
    region: frankfurt
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - vike-ads/**
    disk: # keeps research, concepts, images and consent records across deploys (needs a paid instance)
      name: vike-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD # the password your team types to sign in
        sync: false
      - key: APP_SECRET # signs login cookies
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Optional, add later in the service's Environment tab: META_AD_LIBRARY_TOKEN,
      # GOOGLE_CSE_API_KEY, GOOGLE_CSE_ID.
      - key: OPENAI_MODEL
        value: gpt-5
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3-pro-image-preview
      - key: WEB_SCHEDULER # weekly research refresh inside the web service
        value: "true"
      - key: WEEKLY_RESEARCH_DAY
        value: mon
      - key: WEEKLY_RESEARCH_HOUR
        value: "8"
      - key: TIMEZONE
        value: Europe/Kyiv
