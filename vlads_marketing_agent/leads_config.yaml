# ============================================================================
# Конфігурація пошуку лідів для Vlad's Marketing.
# Модуль 1 (lead_discovery.py) читає цей файл, щоб знати ЩО і ДЕ шукати.
# ============================================================================

# Список пошукових запитів. Кожен запис — це комбінація категорії бізнесу
# та локації. Модуль формує з них Google Places Text Search запит
# на кшталт "{category} {location}".
searches:
  - category: "кав'ярні"
    location: "Львів"
  - category: "меблеві магазини"
    location: "Львів"
  - category: "e-commerce інтернет-магазин одягу"
    location: "Україна"
  - category: "салони краси"
    location: "Львів"
  - category: "фітнес клуби"
    location: "Львів"

# Максимальна кількість НОВИХ лідів, які можна створити за один запуск
# `python main.py discover`. Захищає від випадкового перевищення квоти
# Google Places API (та рахунку за неї).
max_new_leads_per_run: 20

# Максимальна кількість результатів, яку запитувати на один пошуковий
# запит (Google Places повертає максимум 20 на сторінку, до 60 сумарно
# із пагінацією).
max_results_per_search: 20

# Мінімальна кількість відгуків Google, щоб лід вважався вартим уваги
# (відсіює зовсім невідомі/неактивні картки). Поставте 0, щоб вимкнути фільтр.
min_reviews_count: 0
